app = "nfl-edge-ui"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[build.args]
  VITE_API_BASE_URL = "https://nfl-edge.fly.dev/api"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256