app = "nfl-edge"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "backend/Dockerfile"
  context = "."

[env]
  PORT = "8000"
  DEBUG = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[processes]]
  name = "app"
  cmd = ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

[[processes]]
  name = "worker"
  cmd = ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

[[processes]]
  name = "beat"
  cmd = ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
