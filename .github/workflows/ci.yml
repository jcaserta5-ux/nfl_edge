name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nfledge
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nfledge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://nfledge:testpass@localhost:5432/nfledge_test
          ASYNC_DATABASE_URL: postgresql+asyncpg://nfledge:testpass@localhost:5432/nfledge_test
          SECRET_KEY: ci-test-secret-key-32-chars-long!!
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://nfledge:testpass@localhost:5432/nfledge_test
          ASYNC_DATABASE_URL: postgresql+asyncpg://nfledge:testpass@localhost:5432/nfledge_test
          SECRET_KEY: ci-test-secret-key-32-chars-long!!
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: pytest tests/ -v --tb=short

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://nfl-edge.fly.dev/api

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t nfl-edge-backend ./backend
      - name: Build frontend image
        run: docker build -t nfl-edge-frontend ./frontend
